name: Voiceover for TikTok video (new year types)

# Только озвучка через ElevenLabs (без установки пакетов — быстро).
# Видео рендерится локально: python3 tts.py && python3 render.py

on:
  push:
    branches: [claude/tt-video-animation-voiceover-bgp7y0]
    paths:
      - "tiktok/new-year-types/script.py"
      - ".github/workflows/render-newyear.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate voiceover (ElevenLabs)
        working-directory: tiktok/new-year-types
        env:
          TTS_ENGINE: eleven
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tts.py --force --audio-only

      - name: Commit voiceover to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tiktok/new-year-types/audio
          git commit -m "Voiceover for New Year types TikTok video [skip ci]" || exit 0
          git pull --rebase
          git push
